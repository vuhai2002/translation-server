name: translation-server

services:
  translation-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: translation-server:latest
    container_name: translation-server
    restart: unless-stopped
    ports:
      # 127.0.0.1 ONLY - Caddy (host-native) is the sole public ingress and
      # reverse-proxies translate-api.vuhai.io.vn to this host port. Binding
      # 0.0.0.0 would bypass UFW via Docker's iptables rules.
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - translation-server-net
    # --- Hardening baseline (VPS golden) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ipc: private
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # winston log files. Bind mount stays writable under read_only root.
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
          pids: 256
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  translation-server-net:
    driver: bridge
