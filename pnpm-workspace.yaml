# --- Supply-chain hardening (pnpm v11) ---
# pnpm reads these from pnpm-workspace.yaml (camelCase), NOT .npmrc. Per pnpm
# docs: "Only auth and registry settings are read from .npmrc files. All other
# settings ... must be configured in pnpm-workspace.yaml."
# Verified per pnpm docs: https://pnpm.io/settings (checked on pnpm 11.9.0).

# Wait 24h (1440 min) after a version is published before it may be installed,
# giving the community time to detect and pull malicious releases.
minimumReleaseAge: 1440
# Unmet peer dependency ranges warn instead of failing the install.
strictPeerDependencies: false
# `pnpm audit` reports vulnerabilities at moderate severity and above.
auditLevel: moderate

# --- Dependency build-script policy ---
# pnpm v11 blocks postinstall/build scripts by default. `allowBuilds` is the
# pnpm v11 key (a map: package -> true|false); it REPLACED the v10
# onlyBuiltDependencies / ignoredBuiltDependencies list settings, which were
# removed in v11. `true` = allow the build script; `false` = record an explicit
# "do not build" decision (this silences the ERR_PNPM_IGNORED_BUILDS error).
# Verified on pnpm 11.9.0: allowBuilds alone silences the error;
# ignoredBuiltDependencies alone does not (fresh-install test).
#
# unrs-resolver: dev-only transitive (jest -> jest-resolve). It ships a prebuilt
# native binary (@unrs/resolver-binding-*), so jest resolves modules without
# running the build-from-source script. Excluded from prod (`pnpm install --prod`).
allowBuilds:
  unrs-resolver: false
