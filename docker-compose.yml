services:
  translation-api:
    build: .
    container_name: translation-server
    restart: unless-stopped
    ports:
      # Bind to localhost only — Docker otherwise bypasses UFW/iptables
      # and exposes the port publicly. Use a reverse proxy (Caddy/Nginx)
      # on 80/443 to forward traffic here.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    driver: bridge
