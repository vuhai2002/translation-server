services:
  translation-api:
    build: .
    container_name: translation-server
    restart: unless-stopped
    ports:
      # Bind to localhost only — Caddy reaches the container via the
      # shared "nginx-proxy" Docker network, not via host port. The
      # localhost binding is just for direct host-side debugging.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Node http GET probe: no wget --spider HEAD ambiguity, and 127.0.0.1
      # (not localhost) so we skip Alpine's localhost->IPv6 mapping that the
      # IPv4-bound Express server would refuse with ECONNREFUSED.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - proxy

networks:
  # Reuse the external network Caddy sits on so reverse_proxy
  # "translation-server:3000" can resolve via Docker DNS.
  proxy:
    name: nginx-proxy
    external: true
